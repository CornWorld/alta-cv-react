name: Sync public to public mirror

on:
  push:
    branches: [public]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安全防线：public 分支绝不应包含 facts/内部资料。
      # 一旦检测到敏感文档混入 public，直接中断，禁止推送到公开仓库。
      - name: Guard against leaking private facts
        run: |
          if [ -f "docs/resume-facts.md" ]; then
            echo "::error::检测到 docs/resume-facts.md 存在于 public 分支，已中断同步，禁止推送到公开仓库！请检查是否误将 main/for/* 的 facts 内容合并进了 public。"
            exit 1
          fi
          if [ -f "docs/resume-peer-feedback.md" ]; then
            echo "::error::检测到 docs/resume-peer-feedback.md 存在于 public 分支，已中断同步，禁止推送到公开仓库！"
            exit 1
          fi

      - name: Push public to public mirror
        env:
          PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          git push https://x-access-token:${PAT}@github.com/CornWorld/alta-cv-react.git public:main
