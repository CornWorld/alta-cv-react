name: Add branch custom domain
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  add-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register {branch}.cv.corn.im for this branch
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/add-branch-domain.sh
